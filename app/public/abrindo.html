<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Josué</title>
<style>
  html, body { height: 100%; margin: 0; background: #0e1a33; color: #f3e6c8; font: 15px system-ui, sans-serif; }
  body { display: grid; place-items: center; }
  .box { text-align: center; }
  blockquote { max-width: 380px; margin: 14px auto 0; font: italic 16px/1.45 Georgia, serif; color: #f3e6c8; }
  cite { display: block; margin-top: 6px; font: 600 12px system-ui; letter-spacing: .08em; color: #e8b437; font-style: normal; }
  .logo { margin-top: 18px; font-size: 34px; font-weight: 600; letter-spacing: -0.02em; }
  .logo span { color: #e8b437; }
  p { color: #b9a27a; margin-top: 14px; }
  .bar { width: 220px; height: 3px; margin: 18px auto 0; background: #1f3259; border-radius: 2px; overflow: hidden; }
  .bar i { display: block; width: 40%; height: 100%; background: #e8b437; animation: go 1.2s ease-in-out infinite; }
  @keyframes go { from { margin-left: -40% } to { margin-left: 100% } }
</style>
</head>
<body>
<div class="box">
  <img src="img/josue.webp" alt="" width="200" height="200" style="border-radius:28px;box-shadow:0 10px 40px #e8b43740">
  <div class="logo">Josu<span>é</span></div>
  <blockquote>“Seja forte e corajoso, porque o Senhor, seu Deus, estará com você por onde você andar.”<cite>Josué 1:9</cite></blockquote>
  <p id="msg">Abrindo… (carregando os modelos de IA)</p>
  <div class="bar"><i></i></div>
  <small style="display:block;margin-top:22px;font-size:11px;color:#8090b3">Criado por <span style="color:#c4b48f">Flávio Lúcio Curado</span> · 2026</small>
</div>
<script>
  // espera o servidor local responder e então abre o app
  const url = 'http://127.0.0.1:8765/'
  const t0 = Date.now()
  async function poll() {
    try { await fetch(url + 'health', { mode: 'no-cors', cache: 'no-store' }); location.replace(url); return } catch (e) { /* ainda ligando */ }
    if (Date.now() - t0 > 120000) document.getElementById('msg').textContent = 'Está demorando mais que o normal… (veja %LOCALAPPDATA%\\Josue\\servidor.log)'
    setTimeout(poll, 700)
  }
  poll()
</script>
</body>
</html>
